name: Java CI with Maven

on:
  push:
    branches:
      - "**"

jobs:
  build-bookmark-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./bookmarker-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw verify

      # 로그인을 빌드 전에, --password-stdin 방식으로
      - name: Docker Login
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_NAME }}" \
            --password-stdin

      # Jib으로 빌드 + Docker Hub에 직접 푸시 (docker build/push 불필요)
      - name: Build and Push Image
        if: github.ref == 'refs/heads/main'
        run: |
          ./mvnw clean package jib:build -DskipTests \
            -Djib.to.image=${{ secrets.DOCKER_NAME }}/bookmarker-api:latest